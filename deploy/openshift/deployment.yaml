apiVersion: apps/v1
kind: Deployment
metadata:
  name: gary
  labels:
    app.kubernetes.io/name: gary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gary
    spec:
      containers:
        - name: gary
          image: quay.io/REPLACE_ME/gary-demojam:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: gary
  labels:
    app.kubernetes.io/name: gary
spec:
  selector:
    app.kubernetes.io/name: gary
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gary
spec:
  to:
    kind: Service
    name: gary
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
